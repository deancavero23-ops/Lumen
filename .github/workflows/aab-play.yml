# Genera el Android App Bundle firmado para subir a Google Play.
# No publica en Play: solo compila, sube el artefacto y adjunta el AAB a una Release de GitHub.

name: Preparar Lumen Seguridad para Google Play

on:
  push:
    tags: ['play-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      LUMEN_STORE_PASSWORD: lumen2026
      LUMEN_KEY_PASSWORD: lumen2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android preinstalado
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "No se encontró sdkmanager"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Hacer ejecutable el wrapper de Gradle
        working-directory: android-native
        run: chmod +x gradlew

      - name: Compilar AAB firmado
        working-directory: android-native
        run: ./gradlew bundleRelease --stacktrace

      - name: Preparar el AAB y su huella
        working-directory: android-native
        run: |
          cp app/build/outputs/bundle/release/app-release.aab Lumen-Seguridad-1.2.5-play.aab
          sha256sum Lumen-Seguridad-1.2.5-play.aab > SHA256-PLAY-AAB.txt
          cat SHA256-PLAY-AAB.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Seguridad-Play-AAB
          path: |
            android-native/Lumen-Seguridad-1.2.5-play.aab
            android-native/SHA256-PLAY-AAB.txt

      - name: Publicar AAB en la Release
        if: startsWith(github.ref, 'refs/tags/play-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-native/Lumen-Seguridad-1.2.5-play.aab
            android-native/SHA256-PLAY-AAB.txt
