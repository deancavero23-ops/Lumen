# Compila el APK de Lumen (TWA de la PWA) y lo publica en la Release de la versión.
# El APK abre la PWA con Chrome: no limpia Android ni instala un APK de CCleaner.

name: Compilar APK Lumen

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Aceptar licencias e instalar herramientas de Android
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Configurar Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Compilar APK firmado
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: lumen2026
          BUBBLEWRAP_KEY_PASSWORD: lumen2026
        run: bubblewrap build --manifest=twa-manifest.json --skipPwaValidation

      - name: Preparar el APK y su huella
        working-directory: android
        run: |
          cp app-release-signed.apk Lumen-1.0.0.apk
          sha256sum Lumen-1.0.0.apk > SHA256-APK.txt
          cat SHA256-APK.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-apk
          path: |
            android/Lumen-1.0.0.apk
            android/SHA256-APK.txt

      - name: Publicar APK en la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/Lumen-1.0.0.apk
            android/SHA256-APK.txt
