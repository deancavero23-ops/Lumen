# Compila la app nativa de seguridad de Lumen (limpieza por SAF + análisis de apps).
# Es un proyecto limpio: no contiene código de CCleaner y no reemplaza a Play Protect.

name: Compilar Lumen Seguridad

on:
  push:
    tags: ['seguridad-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      LUMEN_STORE_PASSWORD: lumen2026
      LUMEN_KEY_PASSWORD: lumen2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android preinstalado
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "No se encontró sdkmanager"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Hacer ejecutable el wrapper de Gradle
        working-directory: android-native
        run: chmod +x gradlew

      - name: Compilar APK firmada
        working-directory: android-native
        run: ./gradlew assembleRelease --stacktrace

      - name: Preparar el APK y su huella
        working-directory: android-native
        run: |
          cp app/build/outputs/apk/release/app-release.apk Lumen-Seguridad-1.1.0.apk
          sha256sum Lumen-Seguridad-1.1.0.apk > SHA256-SEGURIDAD.txt
          cat SHA256-SEGURIDAD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Seguridad-apk
          path: |
            android-native/Lumen-Seguridad-1.1.0.apk
            android-native/SHA256-SEGURIDAD.txt

      - name: Publicar APK en la Release
        if: startsWith(github.ref, 'refs/tags/seguridad-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-native/Lumen-Seguridad-1.1.0.apk
            android-native/SHA256-SEGURIDAD.txt
