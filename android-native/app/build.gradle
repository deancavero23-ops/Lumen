plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lumen.seguridad'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lumen.seguridad'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.2.1'
    }

    signingConfigs {
        release {
            storeFile file('../lumen-seguridad.keystore')
            storePassword System.getenv('LUMEN_STORE_PASSWORD') ?: 'lumen2026'
            keyAlias 'lumen'
            keyPassword System.getenv('LUMEN_KEY_PASSWORD') ?: 'lumen2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
